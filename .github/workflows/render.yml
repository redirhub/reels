name: Render reels

# Every branch push renders. Pull requests show the check from their head commit, so
# there's no separate pull_request trigger (it would render everything twice).
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # GitHub OIDC → AWS roles (see docs/aws/SETUP.md)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the base commit below

      # Docs-only changes don't touch the videos: skip rendering and publishing
      # (no duplicate uploads), but let the job pass so a required check never blocks.
      - name: Does this change affect the videos?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
        run: |
          render=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" HEAD | grep -qvE '(\.md$|^docs/)'; then render=false; fi
          fi
          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "render=$render (base ${BASE:-none})"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.render == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.render == 'true'
      - run: npm run typecheck
        if: steps.changes.outputs.render == 'true'
      - run: npm run build
        if: steps.changes.outputs.render == 'true'

      - name: Render MP4s and covers
        if: steps.changes.outputs.render == 'true'
        run: npm run render

      # Also kept as a private artifact, e.g. while publishing isn't configured.
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.render == 'true'
        with:
          name: reels-${{ github.sha }}
          path: out/
          retention-days: 7

      - name: Configure AWS credentials
        if: steps.changes.outputs.render == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish to S3 + CloudFront
        if: steps.changes.outputs.render == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        env:
          REELS_S3_BUCKET: ${{ vars.REELS_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: scripts/publish-s3.sh

      # Branch pushes: publish this commit's render for the branch's Vercel preview. A
      # separate role that can only write reels/previews/*, so a branch can never
      # overwrite what main has published.
      - name: Configure AWS credentials (preview)
        if: steps.changes.outputs.render == 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main' && vars.AWS_PREVIEW_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish branch preview
        if: steps.changes.outputs.render == 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main' && vars.AWS_PREVIEW_ROLE_ARN != ''
        env:
          REELS_PREVIEW: '1'
          REELS_S3_BUCKET: ${{ vars.REELS_S3_BUCKET }}
        run: scripts/publish-s3.sh | tee -a "$RUNNER_TEMP/previews.txt"

      - name: Publishing not configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN == ''
        run: echo "::warning::AWS_ROLE_ARN is not set, so renders were not published. See docs/aws/SETUP.md."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rendered reels"
            echo
            if [ "${{ steps.changes.outputs.render }}" != true ]; then
              echo "Docs-only change: nothing rendered or published."
              exit 0
            fi
            echo "Artifact: **reels-${{ github.sha }}** (this run)."
            if [ -s "$RUNNER_TEMP/previews.txt" ]; then
              echo
              echo "Branch preview (also played by this commit's Vercel preview):"
              sed 's/^preview /- /' "$RUNNER_TEMP/previews.txt"
            fi
            if [ -f out/index.json ]; then
              echo
              echo "Published:"
              jq -r '.reels[] | "- \(.id): \(.mp4)"' out/index.json
            fi
            echo
            echo '| File | Size |'
            echo '|---|---|'
            for f in out/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
