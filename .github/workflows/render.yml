name: Render reels

# Every branch push renders. Pull requests show the check from their head commit, so
# there's no separate pull_request trigger (it would render everything twice).
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      reels:
        description: 'Reel ids to render, space-separated (empty = all reels)'
        required: false
        default: ''

# A newer push replaces a running push render (nothing is lost: the next run renders every reel whose
# content has no render yet). Manual runs get their own group, so a push never cancels a render someone started.
concurrency:
  group: render-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # the YouTube videos (5-7 min of 1080p each, some at 60 fps, lossless frames) take most of it
    permissions:
      contents: read
      id-token: write # GitHub OIDC → AWS roles (see docs/aws/SETUP.md)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Renders are named by content key (scripts/reel-keys.mjs: a sha256 of every file that can change
      # the reel), so a reel needs rendering only when renders/<id>/<key> isn't on the CDN yet: whatever
      # commit, branch or cancelled run came before, the same content is never rendered twice.
      # Manual runs render the reels typed in (empty: all), even when already rendered.
      - name: Which reels need rendering?
        id: changes
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          MANUAL_REELS: ${{ inputs.reels }}
        run: |
          if [ -n "$MANUAL" ]; then
            # word-split on purpose: ids only (the script rejects anything that isn't a registered id)
            node scripts/reels-to-render.mjs --force $MANUAL_REELS | tee -a "$GITHUB_OUTPUT"
          else
            node scripts/reels-to-render.mjs | tee -a "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Render MP4s and covers
        if: steps.changes.outputs.render == 'true'
        run: npm run render -- ${{ steps.changes.outputs.reels }} # never empty here (empty would render all)

      # Also kept as a private artifact, e.g. while publishing isn't configured.
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.render == 'true'
        with:
          name: reels-${{ github.sha }}
          path: out/
          retention-days: 7

      # Uploads each new render as renders/<id>/<key>.mp4 (a Vercel preview with the same content
      # plays it); main also points the public latest links at every reel's current key, even
      # when nothing was rendered (a branch rendered it before the merge). Strict on main,
      # best-effort on branches: a missing branch render must never block a branch.
      - name: Configure AWS credentials
        id: aws
        if: (steps.changes.outputs.render == 'true' || github.ref == 'refs/heads/main') && vars.AWS_ROLE_ARN != ''
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish to S3 + CloudFront
        id: publish
        if: steps.aws.outcome == 'success'
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        env:
          REELS_S3_BUCKET: ${{ vars.REELS_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          REELS_PUBLISH_LATEST: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
          REELS_REGISTERED: ${{ steps.changes.outputs.registered }}
          REELS_KEYS: ${{ steps.changes.outputs.keys }}
        run: scripts/publish-s3.sh | tee "$RUNNER_TEMP/published.txt"

      - name: Branch render not published
        if: github.ref != 'refs/heads/main' && (steps.aws.outcome == 'failure' || steps.publish.outcome == 'failure')
        run: echo "::warning::This branch's render wasn't uploaded (is the role's trust policy updated for ref:refs/heads/*? See docs/aws/SETUP.md). It's still in this run's artifact."

      - name: Publishing not configured
        if: vars.AWS_ROLE_ARN == ''
        run: echo "::warning::AWS_ROLE_ARN is not set, so renders were not published. See docs/aws/SETUP.md."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rendered reels"
            echo
            if [ "${{ steps.changes.outputs.render }}" != true ]; then
              echo "Every reel's content is already rendered: nothing to render."
              [ -s "$RUNNER_TEMP/published.txt" ] && sed -E 's/^(latest) /- \1: /' "$RUNNER_TEMP/published.txt" | grep '^- ' || true
              exit 0
            fi
            echo "Rendered: ${{ steps.changes.outputs.reels }}"
            echo
            echo "Artifact: **reels-${{ github.sha }}** (this run)."
            if [ -s "$RUNNER_TEMP/published.txt" ]; then
              echo
              echo "Published:"
              sed -E 's/^(render|branch|latest) /- \1: /' "$RUNNER_TEMP/published.txt" | grep '^- ' || true
            fi
            echo
            echo '| File | Size |'
            echo '|---|---|'
            for f in out/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
