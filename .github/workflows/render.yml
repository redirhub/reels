name: Render reels

# Every branch push renders. Pull requests show the check from their head commit, so
# there's no separate pull_request trigger (it would render everything twice).
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      reels:
        description: 'Reel ids to render, space-separated (empty = all reels)'
        required: false
        default: ''

# A newer push replaces a running push render (the next run diffs from the last finished one, so
# nothing is lost). Manual runs get their own group, so a push never cancels a render someone started.
concurrency:
  group: render-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # the YouTube videos (5 min of 1080p each; forward-domains at 60 fps, lossless frames) take most of it
    permissions:
      contents: read
      actions: read # find this branch's last finished run (the diff base below)
      id-token: write # GitHub OIDC → AWS roles (see docs/aws/SETUP.md)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the base commit below

      # Render only the reels this push affects (scripts/changed-reels.mjs has the rules):
      # a reel's own files → that reel; shared code → all; gallery/CI/docs → none.
      # The diff starts at this branch's last run that finished, not at the previous push: a run
      # cancelled by a newer push rendered nothing, so its changes still need rendering here.
      # Manual runs render the reels typed in (empty: all); first pushes of a branch render everything.
      - name: Which reels does this change affect?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          MANUAL_REELS: ${{ inputs.reels }}
        run: |
          if [ -n "$MANUAL" ]; then
            OUT=$(node scripts/changed-reels.mjs "")
            # Keep only registered ids: the list lands in a shell command below.
            REELS=$(for id in $MANUAL_REELS; do printf '%s\n' "$OUT" | grep '^registered=' | tr ' =' '\n\n' | grep -qx -- "$id" && printf '%s ' "$id" || true; done)
            if [ -n "$MANUAL_REELS" ] && [ -z "$REELS" ]; then echo "::error::No registered reel in: $MANUAL_REELS"; exit 1; fi
            printf '%s\n' "$OUT" | grep -v '^reels=' | tee -a "$GITHUB_OUTPUT"
            echo "reels=${REELS% }" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="$BEFORE"
          if [ -n "$BEFORE" ]; then
            LAST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow render.yml --branch "$GITHUB_REF_NAME" --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)
            if [ -n "$LAST" ] && git merge-base --is-ancestor "$LAST" HEAD; then BASE="$LAST"; fi
          fi
          echo "diff base: ${BASE:-none}" >&2
          node scripts/changed-reels.mjs "$BASE" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.code == 'true'
      - run: npm run typecheck
        if: steps.changes.outputs.code == 'true'
      - run: npm run build
        if: steps.changes.outputs.code == 'true'

      - name: Render MP4s and covers
        if: steps.changes.outputs.render == 'true'
        run: npm run render -- ${{ steps.changes.outputs.reels }}

      # Also kept as a private artifact, e.g. while publishing isn't configured.
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.render == 'true'
        with:
          name: reels-${{ github.sha }}
          path: out/
          retention-days: 7

      # Every branch push uploads renders/<id>/<commit>.mp4 (its Vercel preview plays it);
      # main additionally updates the public latest links. Strict on main, best-effort on
      # branches: a missing branch render must never block a branch (the gallery falls
      # back to the live Player).
      - name: Configure AWS credentials
        id: aws
        if: steps.changes.outputs.render == 'true' && github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish to S3 + CloudFront
        id: publish
        if: steps.aws.outcome == 'success'
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        env:
          REELS_S3_BUCKET: ${{ vars.REELS_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          REELS_PUBLISH_LATEST: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
          REELS_REGISTERED: ${{ steps.changes.outputs.registered }}
        run: scripts/publish-s3.sh | tee "$RUNNER_TEMP/published.txt"

      - name: Branch render not published
        if: github.ref != 'refs/heads/main' && (steps.aws.outcome == 'failure' || steps.publish.outcome == 'failure')
        run: echo "::warning::This branch's render wasn't uploaded (is the role's trust policy updated for ref:refs/heads/*? See docs/aws/SETUP.md). It's still in this run's artifact."

      - name: Publishing not configured
        if: github.event_name == 'push' && vars.AWS_ROLE_ARN == ''
        run: echo "::warning::AWS_ROLE_ARN is not set, so renders were not published. See docs/aws/SETUP.md."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rendered reels"
            echo
            if [ "${{ steps.changes.outputs.render }}" != true ]; then
              echo "No reel affected by this change: nothing rendered or published."
              exit 0
            fi
            echo "Rendered: ${{ steps.changes.outputs.reels || 'all reels' }}"
            echo
            echo "Artifact: **reels-${{ github.sha }}** (this run)."
            if [ -s "$RUNNER_TEMP/published.txt" ]; then
              echo
              echo "Published:"
              sed -E 's/^(render|latest) /- \1: /' "$RUNNER_TEMP/published.txt" | grep '^- ' || true
            fi
            echo
            echo '| File | Size |'
            echo '|---|---|'
            for f in out/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
